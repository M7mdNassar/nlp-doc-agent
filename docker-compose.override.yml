services:
  backend:
    build:
      target: development
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/uv.lock:/app/uv.lock
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENV=development

  worker:
    build:
      target: development
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/uv.lock:/app/uv.lock
    command: celery -A src.worker.main worker --loglevel=info
    environment:
      - ENV=development