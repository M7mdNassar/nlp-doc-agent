name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          cd backend
          uv sync --extra dev

      - name: Lint with ruff
        run: cd backend && uv run --extra dev ruff check .

      - name: Type check with mypy
        run: cd backend && uv run --extra dev mypy src

      - name: Test with pytest
        run: cd backend && uv run --extra dev pytest